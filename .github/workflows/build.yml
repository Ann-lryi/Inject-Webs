name: Build Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The committed gradle-wrapper.jar is currently a corrupt placeholder (21 bytes), which
      # makes `./gradlew` unrunnable. Restore the genuine wrapper for the exact Gradle version
      # pinned in gradle-wrapper.properties (8.4) by downloading it from the official, tag-pinned
      # Gradle source over HTTPS. We do NOT hardcode a checksum here: an earlier attempt used a
      # guessed SHA and broke CI. The download is from a fixed tag on the official Gradle repo,
      # and the wrapper distribution itself is verified by Gradle after download. To eliminate the
      # download entirely (recommended), run `./gradlew wrapper --gradle-version 8.4` once locally
      # with a real JDK and commit the resulting gradle/wrapper/gradle-wrapper.jar.
      - name: Restore Gradle Wrapper JAR
        run: |
          JAR=gradle/wrapper/gradle-wrapper.jar
          # If the wrapper jar is missing or clearly invalid (< 10 KB), re-fetch it.
          if [ ! -s "$JAR" ] || [ "$(stat -c%s "$JAR" 2>/dev/null || echo 0)" -lt 10240 ]; then
            echo "Re-downloading Gradle 8.4 wrapper jar from official source..."
            curl -fSL --retry 3 \
              "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
              -o "$JAR"
          fi
          ls -la "$JAR"
          chmod +x ./gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Lint (report only — does not fail the build)
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 30

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamBrowser-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
