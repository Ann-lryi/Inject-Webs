name: Build Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # The wrapper jar is committed to the repo, but as a safety net verify it matches the
      # known-good SHA-256 for Gradle 8.4 and re-download only if it is missing/corrupt. The old
      # step unconditionally fetched a jar over HTTPS from an unversioned-looking URL and never
      # verified it — a supply-chain risk for every build.
      - name: Verify Gradle Wrapper JAR
        run: |
          EXPECTED_SHA="7d498edd85d4f27afd3612b129a7f55d1c5915d876f59afd8c592fbe167d9e0b"
          JAR=gradle/wrapper/gradle-wrapper.jar
          ACTUAL_SHA=$(sha256sum "$JAR" 2>/dev/null | awk '{print $1}')
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Wrapper jar missing or checksum mismatch — re-downloading Gradle 8.4 wrapper"
            curl -fsSL \
              "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
              -o "$JAR"
            NEW_SHA=$(sha256sum "$JAR" | awk '{print $1}')
            test "$NEW_SHA" = "$EXPECTED_SHA" || { echo "Downloaded wrapper failed checksum"; exit 1; }
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Lint (report only — does not fail the build)
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 30

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StreamBrowser-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
